---
- name: Set test facts for {{ case.name }}
  ansible.builtin.set_fact:
    ansible_facts:
      os_family: "{{ case.os_family }}"
      architecture: "{{ case.arch }}"
    cursor_install_method: "{{ case.install_method }}"

- name: Resolve method and platform for {{ case.name }}
  ansible.builtin.include_tasks: ../tasks/resolve.yml

- name: Assert resolution for {{ case.name }}
  ansible.builtin.assert:
    that:
      - _cursor_resolved_method == case.method
      - _cursor_platform_slug == case.slug
    fail_msg: >-
      {{ case.name }}: expected method={{ case.method }}
      slug={{ case.slug }}, got method={{ _cursor_resolved_method }}
      slug={{ _cursor_platform_slug }}
